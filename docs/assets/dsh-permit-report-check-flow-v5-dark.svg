<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">dsh-permit-report-check — 7 条规则、三种去向的分诊台</title>
<desc id="desc">左侧是输入与归一：file 或 material 二选一（JSON / YAML），表头与 rows[] 经别名匹配归一到 17 个规范栏目，不认得任何已知栏名就拒读；配置里的 disabledRules 与 onlyRules 直接改变出口。中央是随包的规则包 rules/permit-report-check.yaml（版本 2026.1，7 条规则 PR-001..PR-007，5 种 check：conditionalPresence、date、enum、headerPresence、unique），每条规则只走一个出口。右侧三个出口：命中的进 issues[]（本例 PR-001 一条 warn）；没能执行的进 skipped[]（本例 PR-004 因 values 未配置）；跑过而未命中的两栏都不进（PR-002、PR-003、PR-005、PR-006、PR-007）。两条有字的通道汇入同一份报告：error 0 · warn 1 · info 0，issueCount 1 · skippedCount 1，同时给出 markdown 与 reportJson，措辞守卫与免责声明恒常附带；许可决定留给审批人，报告不判合规、不判责任、不判是否应当准予。</desc>
